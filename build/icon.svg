<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a52"/>
      <stop offset="1" stop-color="#0a0c18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="176" y1="0" x2="788" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Base tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#glow)"/>
  <rect x="66" y="66" width="892" height="892" rx="206" fill="none" stroke="url(#edge)" stroke-width="4"/>

  <!-- Faint timeline grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="4">
    <line x1="160" y1="512" x2="864" y2="512"/>
  </g>

  <!-- Waveform bars (symmetric around the centre line) -->
  <g fill="url(#wave)">
    <rect x="176" y="442" width="52" height="140" rx="26"/>
    <rect x="256" y="372" width="52" height="280" rx="26"/>
    <rect x="336" y="282" width="52" height="460" rx="26"/>
    <rect x="416" y="212" width="52" height="600" rx="26"/>
    <rect x="496" y="312" width="52" height="400" rx="26"/>
    <rect x="576" y="242" width="52" height="540" rx="26"/>
    <rect x="656" y="342" width="52" height="340" rx="26"/>
    <rect x="736" y="412" width="52" height="200" rx="26"/>
  </g>

  <!-- Playhead -->
  <g>
    <rect x="637" y="168" width="10" height="688" rx="5" fill="#ffffff" fill-opacity="0.92"/>
    <path d="M612 150 h60 a10 10 0 0 1 7 17 l-30 30 a10 10 0 0 1 -14 0 l-30 -30 a10 10 0 0 1 7 -17 z" fill="#ffffff"/>
  </g>
</svg>
