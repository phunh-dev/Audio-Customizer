[package]
name = "audio-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "wav", "aiff", "flac", "ogg", "vorbis", "pcm"] }
hound = "3.5"
flacenc = "0.5"
mp3lame-encoder = "0.2"
vorbis_rs = "0.5"
rustfft = "6.4"
nnnoiseless = { version = "0.5", default-features = false }
ebur128 = "0.1"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
