[package]
name = "audio-napi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
audio-core = { path = "../audio-core" }
napi = { version = "2.16", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "2.16"
serde_json = "1"
parking_lot = "0.12"

[build-dependencies]
napi-build = "2.1"
